baseurl = "/"
languageCode = "en-us"
title = "Chris Hua"
theme = "hugo-ivy"
googleAnalytics = "G-J2HDEPZHG9"
ignoreFiles = ["\\.Rmd$", "_files$", "_cache$"]
preserveTaxonomyNames = true
footnotereturnlinkcontents = "↩"

[permalinks]
    post = "/post/:year/:month/:day/:slug/"
    note = "/note/:year/:month/:day/:slug/"

[[menu.main]]
    name = "Categories"
    permalink = "/categories/"
    weight = 2
[[menu.main]]
    name = "Tags"
    permalink = "/tags/"
    weight = 3
[[menu.main]]
    name = "Subscribe"
    permalink = "/index.xml"

[params]
    description = "LLM Whisperer"
    footer = "[Github](https://github.com/stillmatic) | [Twitter](https://twitter.com/hingeloss) | [Substack](https://hua.substack.com)"
    favicon = "/favicon.png"
    disqusShortname = ""

[markup]
  defaultMarkdownHandler = 'goldmark'

  [markup.highlight]
    codeFences = true
    style = 'github-dark'
  [markup.goldmark.renderer]
    unsafe=true